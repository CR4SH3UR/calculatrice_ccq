# Build l'app Flutter en web puis la déploie sur Firebase Hosting.
#
# Prérequis (une seule fois) :
#   1. Crée un projet sur https://console.firebase.google.com
#   2. Remplace « calculatrice-ccq » par l'ID de ton projet (ici ET dans .firebaserc)
#   3. Ajoute un secret GitHub « FIREBASE_SERVICE_ACCOUNT » :
#        - Console Firebase → Paramètres du projet → Comptes de service
#          → « Générer une nouvelle clé privée » (fichier JSON)
#        - GitHub → Settings → Secrets and variables → Actions → New secret
#          Nom : FIREBASE_SERVICE_ACCOUNT   Valeur : le contenu du JSON
name: Déploiement Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Build web (release)
        run: flutter build web --release

      - name: Déploiement Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: calculatrice-ccq
